<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Form Submission</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .form-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 80px);
      padding: 8px;
      overflow: hidden;
    }
    .submission-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .submission-card h2 {
      margin: 0 0 10px;
      font-size: 16px;
      color: var(--primary);
    }
    .import-panel {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }
    .import-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 14px;
      color: #333;
    }
    .import-file-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .import-meta span {
      white-space: nowrap;
    }
    .scan-panel {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }
    .scan-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    #scan-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #bbb;
      font-size: 15px;
    }
    .status-summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #1f2937;
      font-size: 13px;
    }
    .table-wrap {
      overflow-x: auto;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }
    table.submission-table {
      width: auto;
      min-width: 400px;
      max-width: 700px;
      margin: 0 auto;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.submission-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
    }
    table.submission-table th,
    table.submission-table td {
      padding: 5px 10px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }
    table.submission-table th:nth-child(1),
    table.submission-table td:nth-child(1) { width: 50px; }
    table.submission-table th:nth-child(2),
    table.submission-table td:nth-child(2) { width: 100px; }
    table.submission-table th:nth-child(3),
    table.submission-table td:nth-child(3) { width: 200px; }
    table.submission-table th:nth-child(4),
    table.submission-table td:nth-child(4) { width: 70px; }
    table.submission-table th {
      background: #10b981;
      color: white;
      font-weight: 600;
    }
    table.submission-table tr.pending td {
      background: #ffffff;
    }
    table.submission-table tr.checked td {
      background: #ecfdf5;
    }
    table.submission-table tr.missing td {
      background: #fef2f2;
    }
    .empty-state {
      padding: 18px;
      border: 1px dashed #9ca3af;
      border-radius: 10px;
      color: #4b5563;
      background: #f8fafc;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <button class="btn-back" onclick="goBack()">←</button>
    <h1>Form Submission</h1>
  </div>

  <div class="form-container">
    <div class="submission-card">
      <h2>Import CSV Submission</h2>
      <div class="import-panel">
        <label class="btn btn-upload" style="max-width: 260px;">
          Pilih file .csv
          <input id="csv-input" type="file" accept=".csv" onchange="importCSV(this)" style="display:none;">
        </label>
        <div class="import-meta">
          <div class="import-file-meta">
            <span>No. Submission: <strong id="submission-number">-</strong></span>
          </div>
          <span>Total data: <strong id="total-count">0</strong></span>
          <span>Tercentang: <strong id="checked-count">0</strong></span>
          <span>Sisa: <strong id="remaining-count">0</strong></span>
        </div>
      </div>

      <div class="scan-panel">
        <label>Scan Barcode Sample ID</label>
        <input id="scan-input" type="text" placeholder="Scan atau ketik Sample ID lalu tekan Enter" onkeydown="handleScanKey(event)">
        <div class="scan-actions">
          <div class="status-summary">
            <div class="status-chip">Total: <span id="summary-total">0</span></div>
            <div class="status-chip">Checked: <span id="summary-checked">0</span></div>
            <div class="status-chip">Pending: <span id="summary-pending">0</span></div>
          </div>
          <div class="action-row" style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;">
            <button class="btn btn-clear" onclick="clearSubmission()" style="min-width:70px;padding:7px 12px;font-size:12px;">DELETE</button>
            <button class="btn btn-save" onclick="saveSubmission()" style="min-width:70px;padding:7px 12px;font-size:12px;">SAVE</button>
            <button class="btn btn-upload" onclick="submitSubmission()" style="min-width:70px;padding:7px 12px;font-size:12px;">SUBMIT</button>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table class="submission-table" id="submission-table">
          <thead>
            <tr>
              <th>No</th>
              <th>Batch</th>
              <th>Sample ID</th>
              <th>Cek</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="4"><div class="empty-state">Belum ada data. Silakan impor file .csv.</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/app.js"></script>
  <script src="js/drive.js"></script>
  <script>
    const STATE_KEY = 'submission_state';
    let submissionData = [];
    let sampleField = 'sample_id';
    let batchField = 'batch';

    function goBack() {
      window.history.back();
    }

    function saveSubmissionState() {
      const state = {
        submissionData,
        sourceFile: document.getElementById('csv-filename').textContent,
        sampleField,
        batchField
      };
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    }

    function loadSubmissionState() {
      const raw = localStorage.getItem(STATE_KEY);
      if (!raw) return;
      try {
        const state = JSON.parse(raw);
        if (Array.isArray(state.submissionData) && state.submissionData.length) {
          submissionData = state.submissionData;
          sampleField = state.sampleField || sampleField;
          batchField = state.batchField || batchField;
          document.getElementById('csv-filename').textContent = state.sourceFile || '-';
        }
      } catch (e) {
        console.warn('Gagal memuat state submission:', e);
      }
    }

    function clearSubmissionState() {
      localStorage.removeItem(STATE_KEY);
    }

    function importCSV(input) {
      if (!input.files.length) return;
      const file = input.files[0];
      // No Submission = nama file (tanpa ekstensi)
      const fileBaseName = file.name.replace(/\.[^/.]+$/, '');
      document.getElementById('submission-number').textContent = fileBaseName;
      const reader = new FileReader();
      reader.onload = (event) => {
        const text = event.target.result;
        const rows = parseCSV(text);
        if (!rows.length) {
          showToast('File CSV kosong atau format tidak valid.');
          return;
        }
        const headers = Object.keys(rows[0]);
        // Debug: tampilkan header yang ditemukan
        console.log('CSV Headers:', headers);
        const sampleKey = findSampleKey(headers);
        const batchKey = findBatchKey(headers);
        const subNoKey = findSubmissionNoKey(headers);
        console.log('sampleKey:', sampleKey, '| batchKey:', batchKey, '| subNoKey:', subNoKey);
        if (!sampleKey) {
          showToast('Kolom tidak ditemukan. Header: ' + headers.join(' | '), 'error');
          return;
        }
        sampleField = sampleKey;
        batchField = batchKey || 'batch';

        // Ambil No Submission dari baris pertama
        if (subNoKey && rows[0][subNoKey]) {
          document.getElementById('submission-number').textContent = rows[0][subNoKey];
        } else {
          document.getElementById('submission-number').textContent = '-';
        }

        submissionData = rows.map((row) => ({
          batch: (batchKey ? row[batchKey] : '').toString().trim(),
          id: (row[sampleKey] || '').toString().trim(),
          info: formatInfo(row, sampleKey),
          status: 'pending'
        })).filter(item => item.id);
        if (!submissionData.length) {
          showToast('Tidak ada No. Waybill valid dalam file.');
        } else {
          showToast(submissionData.length + ' data berhasil diimport dari ' + file.name);
          // Tampilkan submission number jika ada kolom submission_no
          const subNoKey = Object.keys(rows[0]).find(k => /submission|sub_no|no_sub/i.test(k));
          if (subNoKey && rows[0][subNoKey]) {
            document.getElementById('submission-number').textContent = rows[0][subNoKey];
          }
        }
        renderSubmissionTable();
        saveSubmissionState();
      };
      reader.readAsText(file, 'UTF-8');
    }

    function parseCSV(csvText) {
      const rows = [];
      const delimiter = detectDelimiter(csvText);
      const lines = csvText.trim().split(/\r?\n/).filter(line => line.trim());
      if (!lines.length) return rows;
      const headers = csvRowToArray(lines[0], delimiter).map(h => h.trim().toLowerCase().replace(/\s+/g, '_'));
      for (let i = 1; i < lines.length; i++) {
        const values = csvRowToArray(lines[i], delimiter);
        const row = {};
        headers.forEach((header, index) => {
          row[header] = (values[index] || '').trim();
        });
        rows.push(row);
      }
      return rows;
    }

    function detectDelimiter(text) {
      const sample = text.split(/\r?\n/)[0];
      if (sample.includes(';')) return ';';
      if (sample.includes('\t')) return '\t';
      return ',';
    }

    function csvRowToArray(text, delimiter) {
      const pattern = new RegExp(
        (
          "(\\" + delimiter + "|\\r?\\n|\\r|^)" +
          "(?:\\\"([^\\\"]*(?:\\\"\\\"[^\\\"]*)*)\\\"|" +
          "([^\\\"" + delimiter + "]*))"
        ),
        'gi'
      );
      const row = [];
      let matches = null;
      while ((matches = pattern.exec(text))) {
        const matchedValue = matches[2] ? matches[2].replace(/\\\"\\\"/g, '"') : matches[3];
        row.push(matchedValue);
        if (matches[1] === '\r' || matches[1] === '\n' || matches[1] === '\r\n') break;
      }
      return row;
    }

    function findSampleKey(keys) {
      // Cari exact match dulu (case-insensitive)
      const exactMatch = keys.find(k => k.trim().toLowerCase() === 'sample id' || k.trim().toLowerCase() === 'sample_id' || k.trim().toLowerCase() === 'sampleid');
      if (exactMatch) return exactMatch;
      // Cari yang mengandung "sample"
      const sampleMatch = keys.find(k => k.trim().toLowerCase().includes('sample'));
      if (sampleMatch) return sampleMatch;
      // Cari yang mengandung "gs" atau "id" tapi bukan "no"
      const idMatch = keys.find(k => {
        const n = k.trim().toLowerCase();
        return (n.includes('id') || n.includes('gs')) && !n.startsWith('no');
      });
      if (idMatch) return idMatch;
      // Fallback: kolom terakhir sebelum "cek"
      const cekIdx = keys.findIndex(k => k.trim().toLowerCase() === 'cek');
      if (cekIdx > 0) return keys[cekIdx - 1];
      return keys[keys.length - 1] || null;
    }

    function findSubmissionNoKey(keys) {
      // Cari exact match "no submission" atau "no. submission"
      const exact = keys.find(k => /no[\s._-]*submission/i.test(k.trim()));
      if (exact) return exact;
      const sub = keys.find(k => /submission/i.test(k.trim()));
      if (sub) return sub;
      return null;
    }

    function findBatchKey(keys) {
      const normalized = keys.map(k => k.toLowerCase().replace(/[\s_-]/g, ''));
      const candidates = ['batch', 'batchno', 'lot', 'package', 'pack', 'grup', 'group'];
      const found = candidates.find(key => normalized.includes(key));
      if (found) return keys[normalized.indexOf(found)];
      return null;
    }

    function formatInfo(row, sampleKey) {
      return Object.entries(row)
        .filter(([key, value]) => key !== sampleKey && value)
        .map(([key, value]) => `${key}: ${value}`)
        .join(' | ');
    }

    function renderSubmissionTable() {
      const tbody = document.querySelector('#submission-table tbody');
      tbody.innerHTML = '';
      if (!submissionData.length) {
        tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">Belum ada data. Silakan impor file .csv.</div></td></tr>`;
      } else {
        submissionData.forEach((item, index) => {
          const row = document.createElement('tr');
          row.className = item.status === 'checked' ? 'checked' : 'pending';
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${item.batch || '-'}</td>
            <td>${item.id}</td>
            <td>${item.status === 'checked' ? '✅ Cek list' : ''}</td>
          `;
          tbody.appendChild(row);
        });
      }
      updateCounts();
    }


    function updateCounts() {
      const total = submissionData.length;
      const checked = submissionData.filter(item => item.status === 'checked').length;
      const remaining = total - checked;
      document.getElementById('total-count').textContent = total;
      document.getElementById('checked-count').textContent = checked;
      document.getElementById('remaining-count').textContent = remaining;
      document.getElementById('summary-total').textContent = total;
      document.getElementById('summary-checked').textContent = checked;
      document.getElementById('summary-pending').textContent = remaining;
    }

    function handleScanKey(event) {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      const value = event.target.value.trim();
      if (!value) return;
      checkSampleId(value);
      event.target.value = '';
    }

    function checkSampleId(code) {
      const normalized = code.toString().trim().toLowerCase();
      const target = submissionData.find(item => item.id.toLowerCase() === normalized);
      if (!target) {
        showToast(`Sample ID ${code} tidak ditemukan.`);
        return;
      }
      if (target.status === 'checked') {
        showToast(`Sample ID ${code} sudah discan.`);
        return;
      }
      target.status = 'checked';
      renderSubmissionTable();
      saveSubmissionState();
      showToast(`Sample ID ${code} berhasil diverifikasi.`);
    }

    function clearSubmission() {
      submissionData = [];
      document.getElementById('csv-input').value = '';
      document.getElementById('csv-filename').textContent = '-';
      clearSubmissionState();
      renderSubmissionTable();
      showToast('Daftar submission dikosongkan.');
    }

    function saveSubmission() {
      if (!submissionData.length) {
        showToast('Tidak ada data untuk disimpan.');
        return;
      }
      const record = {
        createdAt: new Date().toISOString(),
        sourceFile: document.getElementById('csv-filename').textContent,
        entries: submissionData
      };
      DB.save('submission', record);
      showToast('Data submission tersimpan.');
    }

    function submitSubmission() {
      if (!submissionData.length) {
        showToast('Silakan impor data sebelum submit.');
        return;
      }
      const csvData = convertToExcel(submissionData);
      downloadExcel(csvData);
      showToast('Data submission berhasil diexport.');
    }

    function convertToExcel(data) {
      if (!data.length) return '';
      const headers = ['No', 'Batch', 'No. Waybill', 'Status'];
      const rows = data.map((item, idx) => [
        idx + 1,
        item.batch || '-',
        item.id,
        item.status === 'checked' ? 'Checked' : 'Pending'
      ]);
      const csvRows = [
        headers.join(','),
        ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
      ];
      return csvRows.join('\r\n');
    }

    function downloadExcel(csvData) {
      const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      const fileName = `submission_${new Date().toISOString().slice(0,10)}.csv`;
      link.setAttribute('href', url);
      link.setAttribute('download', fileName);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    loadSubmissionState();
    renderSubmissionTable();
  </script>
</body>
</html>
